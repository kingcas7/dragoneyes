<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>보이스 클로드 — 음성 대화</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #1a1e32;
    --panel2: #232848;
    --text: #eef0fa;
    --sub: #9aa2c5;
    --accent: #7c8cff;
    --accent2: #4ade80;
    --danger: #f87171;
    --user-bubble: #34406e;
    --ai-bubble: #232848;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Noto Sans KR", -apple-system, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }

  /* ── 헤더 ── */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: var(--panel); flex-shrink: 0;
    border-bottom: 1px solid #2b3050;
  }
  header .title { font-size: 1.05rem; font-weight: 700; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button {
    background: var(--panel2); color: var(--text); border: none; border-radius: 10px;
    padding: 10px 12px; font-size: 1rem; cursor: pointer; flex-shrink: 0;
  }

  /* ── 채팅 영역 ── */
  #chat {
    flex: 1; overflow-y: auto; padding: 14px 12px 8px; display: flex;
    flex-direction: column; gap: 10px; scroll-behavior: smooth;
  }
  .msg { max-width: 86%; padding: 11px 14px; border-radius: 16px;
    font-size: 1.02rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 5px; }
  .msg.ai   { align-self: flex-start; background: var(--ai-bubble); border-bottom-left-radius: 5px; }
  .msg.ai .replay { display: inline-block; margin-top: 6px; color: var(--accent);
    font-size: .88rem; cursor: pointer; }
  .hint { align-self: center; color: var(--sub); font-size: .9rem; text-align: center;
    padding: 20px 16px; line-height: 1.7; }

  /* ── 상태 바 ── */
  #statusBar {
    text-align: center; padding: 6px 12px; font-size: .95rem; color: var(--sub);
    min-height: 30px; flex-shrink: 0;
  }
  #statusBar.listening { color: var(--accent2); }
  #statusBar.speaking { color: var(--accent); }
  #statusBar.error { color: var(--danger); }

  /* ── 하단 컨트롤 ── */
  #controls {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px 16px;
    background: var(--panel); flex-shrink: 0; border-top: 1px solid #2b3050;
  }
  #textInput {
    flex: 1; background: var(--panel2); border: 1px solid #343a63; color: var(--text);
    border-radius: 22px; padding: 12px 16px; font-size: 1rem; outline: none; min-width: 0;
  }
  #sendBtn {
    background: var(--panel2); color: var(--text); border: none; border-radius: 50%;
    width: 46px; height: 46px; font-size: 1.15rem; cursor: pointer; flex-shrink: 0;
  }
  #micBtn {
    width: 62px; height: 62px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 1.7rem; flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(124,140,255,.45); transition: background .25s;
  }
  #micBtn.on { background: #16a34a; animation: pulse 1.4s ease-in-out infinite; }
  #micBtn.speaking { background: #d97706; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }

  /* ── 오버레이 공통 ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(8,10,20,.72); display: none;
    z-index: 50; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--panel); width: 100%; max-width: 560px; max-height: 88vh;
    border-radius: 20px 20px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .sheet h2 { font-size: 1.15rem; margin-bottom: 14px; }
  .sheet label { display: block; color: var(--sub); font-size: .92rem; margin: 14px 0 6px; }
  .sheet input, .sheet select {
    width: 100%; background: var(--panel2); border: 1px solid #343a63; color: var(--text);
    border-radius: 10px; padding: 12px; font-size: 1rem; outline: none;
  }
  .sheet .btnRow { display: flex; gap: 10px; margin-top: 20px; }
  .sheet .btnRow button {
    flex: 1; border: none; border-radius: 12px; padding: 14px; font-size: 1.02rem;
    cursor: pointer; font-weight: 600;
  }
  .btnPrimary { background: var(--accent); color: #fff; }
  .btnGhost { background: var(--panel2); color: var(--text); }
  .note { color: var(--sub); font-size: .85rem; line-height: 1.6; margin-top: 12px; }
  .note b { color: var(--text); }

  /* ── 방 목록 ── */
  .roomItem {
    display: flex; align-items: center; gap: 10px; padding: 13px 10px;
    border-bottom: 1px solid #2b3050; cursor: pointer; border-radius: 8px;
  }
  .roomItem:active { background: var(--panel2); }
  .roomItem .rname { flex: 1; min-width: 0; }
  .roomItem .rname .t { font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .roomItem .rname .s { font-size: .82rem; color: var(--sub); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .roomItem .del { color: var(--danger); font-size: 1.05rem; padding: 8px; background: none; border: none; cursor: pointer; }
  #newRoomBtn { width: 100%; margin-top: 14px; background: var(--accent); color: #fff;
    border: none; border-radius: 12px; padding: 14px; font-size: 1.02rem; font-weight: 600; cursor: pointer; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--sub);
    border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -3px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <button id="roomsBtn" aria-label="대화방 목록">☰</button>
  <div class="title" id="roomTitle">보이스 클로드</div>
  <button id="newChatBtn" aria-label="새 대화방 만들기">➕</button>
  <button id="clearChatBtn" aria-label="현재 대화 비우기">🧹</button>
  <button id="voiceModeBtn" aria-label="연속 음성 대화 켜기">🔊</button>
  <button id="settingsBtn" aria-label="설정">⚙️</button>
</header>

<div id="chat"></div>
<div id="statusBar"></div>

<div id="controls">
  <input id="textInput" type="text" placeholder="메시지 입력 또는 마이크를 누르세요"
         autocomplete="off" enterkeyhint="send">
  <button id="sendBtn" aria-label="전송">➤</button>
  <button id="micBtn" aria-label="음성으로 말하기">🎤</button>
</div>

<!-- 설정 시트 -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h2>⚙️ 설정</h2>
    <label for="apiKeyInput">Claude API 키</label>
    <input id="apiKeyInput" type="password" placeholder="sk-ant-api03-..." autocomplete="off">
    <label for="modelSelect">모델</label>
    <select id="modelSelect">
      <option value="claude-opus-5">Claude Opus 5 — 가장 똑똑함 (기본)</option>
      <option value="claude-sonnet-5">Claude Sonnet 5 — 빠르고 저렴</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 — 가장 저렴</option>
    </select>
    <label for="speedSelect">응답 속도</label>
    <select id="speedSelect">
      <option value="low">빠른 답변 (일상 대화 추천)</option>
      <option value="high">깊게 생각한 답변 (조금 느림)</option>
    </select>
    <label for="rateSelect">읽기 속도</label>
    <select id="rateSelect">
      <option value="0.9">느리게</option>
      <option value="1.0" selected>보통</option>
      <option value="1.2">빠르게</option>
      <option value="1.4">아주 빠르게</option>
    </select>
    <label for="bargeSelect">말 끼어들기 (바지인) — 실험 기능</label>
    <select id="bargeSelect">
      <option value="off">사용 안 함 (기본)</option>
      <option value="on">사용 — 낭독 중 말을 시작하면 즉시 멈추고 들어요</option>
    </select>

    <h2 style="margin-top:22px">☁️ 기기 간 동기화 (선택)</h2>
    <div class="note" style="margin-top:0">
      아래 3칸을 PC와 폰에 <b>똑같이</b> 입력하면 대화방과 대화 내역이 기기끼리 공유됩니다.
      대화 내용은 동기화 암호로 <b>암호화되어</b> 저장됩니다.
    </div>
    <label for="syncUrlInput">Supabase URL</label>
    <input id="syncUrlInput" type="text" placeholder="https://xxxx.supabase.co" autocomplete="off">
    <label for="syncAnonInput">Supabase anon 키</label>
    <input id="syncAnonInput" type="password" placeholder="eyJhbGciOi..." autocomplete="off">
    <label for="syncPassInput">동기화 암호 (직접 정하는 비밀 문구)</label>
    <input id="syncPassInput" type="password" placeholder="예: 우리집드래곤7" autocomplete="off">
    <button class="btnPrimary" id="syncNowBtn"
      style="width:100%;margin-top:14px;border:none;border-radius:12px;padding:13px;font-size:1rem;font-weight:600;cursor:pointer">
      ☁️ 지금 동기화
    </button>
    <div class="note" id="syncStatus"></div>

    <div class="note">
      <b>API 키는 이 폰에만 저장</b>되고 Anthropic 서버 외에는 어디에도 전송되지 않습니다.
      대화 내용도 이 폰에만 저장됩니다. 사용한 만큼 API 요금이 부과되니
      공용 기기에서는 사용 후 키를 지워주세요.
      <span id="usageNote"></span>
    </div>
    <div class="btnRow">
      <button class="btnGhost" id="clearKeyBtn">키 삭제</button>
      <button class="btnPrimary" id="saveSettingsBtn">저장</button>
    </div>
  </div>
</div>

<!-- 대화방 목록 시트 -->
<div class="overlay" id="roomsOverlay">
  <div class="sheet">
    <h2>💬 대화방</h2>
    <button id="memoOpenBtn" class="btnGhost"
      style="width:100%;border:none;border-radius:12px;padding:13px;font-size:1rem;cursor:pointer;margin-bottom:12px;text-align:left">
      💡 아이디어 메모함 <span id="memoCount"></span>
    </button>
    <div id="roomList"></div>
    <button id="newRoomBtn">＋ 새 대화방</button>
  </div>
</div>

<!-- 아이디어 메모함 시트 -->
<div class="overlay" id="memoOverlay">
  <div class="sheet">
    <h2>💡 아이디어 메모</h2>
    <div class="note" style="margin-top:0">
      대화 중 <b>"메모해줘, ..."</b> 라고 말하면 여기에 즉시 저장됩니다 (API 비용 없음).
    </div>
    <div id="memoList" style="margin-top:10px"></div>
    <div class="btnRow">
      <button class="btnGhost" id="memoAddBtn">＋ 직접 추가</button>
      <button class="btnPrimary" id="memoExportBtn">📄 전체 워드 저장</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ════════════════ 저장소 ════════════════ */
  var LS = window.localStorage;
  function getJSON(k, d) { try { var v = LS.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function setJSON(k, v) { try { LS.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var settings = getJSON("vc_settings", { apiKey: "", model: "claude-opus-5", effort: "low", rate: 1.0, totalTokens: 0,
    syncUrl: "", syncAnon: "", syncPass: "" });
  var rooms = getJSON("vc_rooms", []);
  var deletedRooms = getJSON("vc_deleted", []);   // 삭제 전파용 tombstone
  var currentRoomId = LS.getItem("vc_current_room") || null;

  function saveSettings() { setJSON("vc_settings", settings); }
  function saveRooms() { setJSON("vc_rooms", rooms); }
  function msgsKey(id) { return "vc_msgs_" + id; }
  function loadMsgs(id) { return getJSON(msgsKey(id), []); }
  function saveMsgs(id, msgs) { setJSON(msgsKey(id), msgs); }

  function newRoom() {
    var id = "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var room = { id: id, name: "새 대화", createdAt: Date.now() };
    rooms.unshift(room); saveRooms();
    currentRoomId = id; LS.setItem("vc_current_room", id);
    return room;
  }
  function currentRoom() {
    var r = rooms.find(function (x) { return x.id === currentRoomId; });
    if (!r) { r = rooms[0] || newRoom(); currentRoomId = r.id; LS.setItem("vc_current_room", r.id); }
    return r;
  }

  /* ════════════════ 상태 ════════════════ */
  var IS_ANDROID = /Android/i.test(navigator.userAgent || "");
  var voiceMode = false;        // 연속 음성 대화 모드
  var busy = false;             // API 호출 중
  var currentAbort = null;      // 진행 중인 답변 요청 취소용
  var recognizing = false;
  var recog = null;
  var wakeLock = null;
  var messages = [];            // 현재 방 메시지 [{role, content}]

  var $ = function (id) { return document.getElementById(id); };
  var chatEl = $("chat"), statusEl = $("statusBar"), micBtn = $("micBtn"),
      inputEl = $("textInput"), voiceModeBtn = $("voiceModeBtn");

  function setStatus(text, cls) {
    statusEl.textContent = text || "";
    statusEl.className = cls || "";
  }

  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
    } catch (e) {}
  }

  /* ── 문서 저장 (워드 .doc / 엑셀 .csv) ── */
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function fileStamp() {
    var d = new Date();
    return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") +
      "_" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0");
  }
  function downloadBlob(blob, filename) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function saveAsWord(text, title) {
    var today = new Date().toLocaleDateString("ko-KR");
    var html = "<html xmlns:w='urn:schemas-microsoft-com:office:word'><head><meta charset='utf-8'>" +
      "<title>" + escapeHtml(title || "보이스 클로드") + "</title></head>" +
      "<body style='font-family:Malgun Gothic,\"맑은 고딕\",sans-serif;font-size:11pt;line-height:1.7'>" +
      "<h2>" + escapeHtml(title || "보이스 클로드 정리") + " (" + today + ")</h2>" +
      String(text).split(/\n+/).map(function (p) { return "<p>" + escapeHtml(p) + "</p>"; }).join("") +
      "</body></html>";
    downloadBlob(new Blob(["\ufeff", html], { type: "application/msword" }), "보이스클로드_" + fileStamp() + ".doc");
  }
  function saveAsExcel(text, btnEl) {
    if (!settings.apiKey) { openSettings(); return; }
    var orig = btnEl.textContent;
    btnEl.textContent = "⏳ 표로 변환 중…";
    var model = settings.model || "claude-opus-5";
    var body = {
      model: model, max_tokens: 2048,
      output_config: { effort: "low" },
      messages: [{
        role: "user",
        content: "다음 내용을 엑셀에서 열 수 있는 표로 정리하라. 적절한 열 제목을 첫 줄에 두고, CSV 형식 텍스트만 출력하라. 설명 문장이나 코드블록 없이 CSV만 출력한다. 셀 안에 쉼표가 있으면 그 셀을 큰따옴표로 감싸라.\n\n" + text
      }]
    };
    if (model === "claude-opus-5") body.fallbacks = "default";
    fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", headers: apiHeaders(model), body: JSON.stringify(body)
    }).then(function (res) { return res.json(); }).then(function (data) {
      var csv = "";
      (data.content || []).forEach(function (b) { if (b.type === "text") csv += b.text; });
      csv = csv.replace(/^```[a-z]*\n?/i, "").replace(/```\s*$/, "").trim();
      if (!csv) throw new Error("empty");
      if (data.usage) {
        settings.totalTokens = (settings.totalTokens || 0) +
          (data.usage.input_tokens || 0) + (data.usage.output_tokens || 0);
        saveSettings();
      }
      downloadBlob(new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" }), "보이스클로드_" + fileStamp() + ".csv");
      btnEl.textContent = "✅ 저장됨";
      setTimeout(function () { btnEl.textContent = orig; }, 2000);
    }).catch(function () {
      btnEl.textContent = "⚠️ 실패";
      setTimeout(function () { btnEl.textContent = orig; }, 2000);
    });
  }

  /* ── 아이디어 메모 ── */
  var memos = getJSON("vc_memos", []);
  var memoDeleted = getJSON("vc_memo_deleted", []);
  function saveMemos() { setJSON("vc_memos", memos); setJSON("vc_memo_deleted", memoDeleted); }
  function addMemo(text) {
    memos.unshift({ id: "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), text: text, t: Date.now() });
    saveMemos(); schedulePush();
  }

  /* ════════════════ TTS — 문장 청크 발화 엔진 (끊김 방지) ════════════════ */
  var ttsSeq = 0, ttsActive = false, utterKeep = [];

  // 데스크톱 Chrome 15초 자동 정지 우회 (Android는 pause()가 발화를 죽이므로 제외)
  if (!IS_ANDROID) {
    setInterval(function () {
      try {
        if (speechSynthesis.speaking) { speechSynthesis.pause(); speechSynthesis.resume(); }
      } catch (e) {}
    }, 14000);
  }

  function splitChunks(text, maxLen) {
    var out = [], rest = String(text).replace(/\s+/g, " ").trim();
    while (rest.length > maxLen) {
      var cut = -1, marks = [". ", "! ", "? ", "。", "… ", "; "];
      for (var i = 0; i < marks.length; i++) {
        var p = rest.lastIndexOf(marks[i], maxLen);
        if (p > cut) cut = p + marks[i].length - 1;
      }
      if (cut < 30) {
        var p2 = rest.lastIndexOf(", ", maxLen);
        if (p2 < 30) p2 = rest.lastIndexOf(" ", maxLen);
        cut = (p2 >= 30) ? p2 : maxLen - 1;
      }
      out.push(rest.substring(0, cut + 1).trim());
      rest = rest.substring(cut + 1).trim();
    }
    if (rest) out.push(rest);
    return out;
  }

  function stopSpeaking() {
    ttsSeq++; ttsActive = false; utterKeep = [];
    stopVAD();
    try { speechSynthesis.cancel(); } catch (e) {}
  }

  /* ── 바지인(말 끼어들기) — 발화 중 음성 감지 시 낭독 중단 ── */
  var vadStream = null, vadCtx = null, vadTimer = null;
  function startVAD(onBarge) {
    if (vadStream || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    }).then(function (stream) {
      vadStream = stream;
      var AC = window.AudioContext || window.webkitAudioContext;
      vadCtx = new AC();
      var src = vadCtx.createMediaStreamSource(stream);
      var an = vadCtx.createAnalyser(); an.fftSize = 512;
      src.connect(an);
      var buf = new Uint8Array(an.fftSize);
      var voiceMs = 0;
      vadTimer = setInterval(function () {
        try {
          an.getByteTimeDomainData(buf);
          var sum = 0;
          for (var i = 0; i < buf.length; i++) { var d = (buf[i] - 128) / 128; sum += d * d; }
          var rms = Math.sqrt(sum / buf.length);

    (local.rooms || []).forEach(function (r) {

      var el = $("syncStatus");
      if (el) el.textContent = msg;
      if (manual) setStatus(msg, isErr ? "error" : "");
    };
    if (manual) report("동기화 중…");
    return pullRemote().then(function (remote) {
      var merged = remote ? mergeStates(remote, localState()) : localState();
      applyState(merged);
      renderRoom();
      return pushRemote(merged);
    }).then(function () {
      report("☁️ 동기화 완료 (" + new Date().toLocaleTimeString("ko-KR") + ")");
    }).catch(function (e) {
      report("동기화 실패: " + e.message + " — URL/키/표 설정을 확인해주세요.", true);
    }).then(function () { syncBusy = false; });
  }

  function schedulePush() {
    if (!syncConfigured()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      pushRemote(localState()).catch(function (e) { console.warn("[sync push]", e.message); });
    }, 2500);
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && !busy) fullSync(false);
  });

  /* ════════════════ 대화 흐름 ════════════════ */
  function sendMessage(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    // ⭐ "메모해줘 ..." — 클로드 호출 없이 아이디어 메모함에 즉시 저장 (무료)
    var mm = text.match(/^(메모해줘|메모 해줘|메모해 줘|메모)[,.:! ]+(.+)$/);
    if (mm && mm[2].trim()) {
      addMemo(mm[2].trim());
      setStatus("💡 메모했어요. (☰ → 아이디어 메모함에서 확인)");
      if (voiceMode) speak("메모했어요.", function () { if (voiceMode) setTimeout(startListening, 300); });
      return;
    }
    if (!settings.apiKey) { openSettings(); return; }
    stopListening();
    busy = true;
    $("sendBtn").textContent = "⏹";
    $("sendBtn").setAttribute("aria-label", "답변 중지");
    messages.push({ role: "user", content: text });
    renderMessage("user", text);
    persistCurrent(text);
    statusEl.innerHTML = '<span class="spinner"></span>생각하는 중… (⏹를 누르면 중지)';

    var history = messages.slice(-24).map(function (m) { return { role: m.role, content: m.content }; });
    callClaude(history, function (err, answer) {
      busy = false;
      currentAbort = null;
      $("sendBtn").textContent = "➤";
      $("sendBtn").setAttribute("aria-label", "전송");
      if (err) {
        messages.pop();   // 실패/중지된 user 턴 롤백
        var arr = loadMsgs(currentRoomId); arr.pop(); saveMsgs(currentRoomId, arr);
        var lastMsg = chatEl.lastElementChild;
        if (lastMsg && lastMsg.classList.contains("user")) chatEl.removeChild(lastMsg);
        if (err === "__ABORTED__") {
          setStatus("답변을 중지했어요. 다시 말씀해주세요.");
          if (voiceMode) setTimeout(startListening, 400);
          return;
        }
        setStatus(err, "error");
        if (voiceMode) speak(err, function () { setTimeout(startListening, 300); });
        return;
      }
      messages.push({ role: "assistant", content: answer });
      var arr2 = loadMsgs(currentRoomId);
      arr2.push({ role: "assistant", content: answer, t: Date.now() });
      saveMsgs(currentRoomId, arr2);
      schedulePush();
      renderMessage("ai", answer);
      setStatus("");
      if (voiceMode) {
        speak(answer, function () {
          if (voiceMode) { setStatus(""); setTimeout(startListening, 350); }
        });
      }
    });
  }

  function persistCurrent(userText) {
    var arr = loadMsgs(currentRoomId);
    arr.push({ role: "user", content: userText, t: Date.now() });
    saveMsgs(currentRoomId, arr);
    var room = currentRoom();
    if (room.name === "새 대화") {
      room.name = userText.length > 24 ? userText.slice(0, 24) + "…" : userText;
      saveRooms(); $("roomTitle").textContent = room.name;
    }
    schedulePush();
  }

  /* ════════════════ 렌더링 ════════════════ */
  function renderMessage(kind, text) {
    var div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    if (kind === "ai") {
      var rp = document.createElement("span");
      rp.className = "replay"; rp.textContent = "🔊 다시 듣기";
      rp.addEventListener("click", function () { stopSpeaking(); stopListening(); speak(text); });
      var cp = document.createElement("span");
      cp.className = "replay"; cp.style.marginLeft = "14px"; cp.textContent = "📋 복사";
      cp.addEventListener("click", function () {
        var done = function () { cp.textContent = "✅ 복사됨"; setTimeout(function () { cp.textContent = "📋 복사"; }, 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
        } else { fallbackCopy(text); done(); }
      });
      var wd2 = document.createElement("span");
      wd2.className = "replay"; wd2.style.marginLeft = "14px"; wd2.textContent = "📄 워드";
      wd2.addEventListener("click", function () { saveAsWord(text, "보이스 클로드 정리"); });
      var xl = document.createElement("span");
      xl.className = "replay"; xl.style.marginLeft = "14px"; xl.textContent = "📊 엑셀";
      xl.addEventListener("click", function () { saveAsExcel(text, xl); });
      div.appendChild(document.createElement("br"));
      div.appendChild(rp);
      div.appendChild(cp);
      div.appendChild(wd2);
      div.appendChild(xl);
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function renderRoom() {
    var room = currentRoom();
    $("roomTitle").textContent = room.name === "새 대화" ? "보이스 클로드" : room.name;
    chatEl.innerHTML = "";
    var stored = loadMsgs(room.id);
    messages = stored.map(function (m) { return { role: m.role, content: m.content }; });
    if (!stored.length) {
      var h = document.createElement("div");
      h.className = "hint";
      h.innerHTML = "🎤 마이크 버튼을 누르고 편하게 말을 걸어보세요.<br>" +
        "🔊 상단 스피커 버튼을 켜면 <b>손 안 대고 연속 대화</b>가 됩니다.<br>" +
        "답변이 끝나면 자동으로 다시 들어요. \"대화 종료\"라고 말하면 멈춥니다.";
      chatEl.appendChild(h);
    } else {
      stored.forEach(function (m) { renderMessage(m.role === "user" ? "user" : "ai", m.content); });
    }
  }

  function renderRoomList() {
    var list = $("roomList");
    list.innerHTML = "";
    if (!rooms.length) {
      var e = document.createElement("div");
      e.className = "note"; e.textContent = "대화방이 없어요. 새 대화방을 만들어보세요.";
      list.appendChild(e);
      return;
    }
    rooms.forEach(function (room) {
      var item = document.createElement("div");
      item.className = "roomItem";
      var last = loadMsgs(room.id).slice(-1)[0];
      item.innerHTML = '<div class="rname"><div class="t"></div><div class="s"></div></div>';
      item.querySelector(".t").textContent = room.name;
      item.querySelector(".s").textContent = last ? last.content.slice(0, 40) : "대화 없음";
      var ren = document.createElement("button");
      ren.className = "del"; ren.style.color = "var(--accent)"; ren.textContent = "✏️";
      ren.setAttribute("aria-label", "이름 바꾸기");
      ren.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var newName = prompt("새 대화방 이름을 입력하세요", room.name);
        if (!newName || !newName.trim()) return;
        room.name = newName.trim().slice(0, 30);
        room.renamedAt = Date.now();   // 동기화 시 최신 이름이 이기도록 시각 기록
        saveRooms(); renderRoomList(); schedulePush();
        if (room.id === currentRoomId) $("roomTitle").textContent = room.name;
      });
      item.appendChild(ren);
      var del = document.createElement("button");
      del.className = "del"; del.textContent = "🗑"; del.setAttribute("aria-label", "삭제");
      del.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (!confirm('"' + room.name + '" 대화방을 삭제할까요?')) return;
        rooms = rooms.filter(function (x) { return x.id !== room.id; });
        LS.removeItem(msgsKey(room.id)); saveRooms();
        deletedRooms.push(room.id); setJSON("vc_deleted", deletedRooms);
        schedulePush();
        if (currentRoomId === room.id) { currentRoomId = null; renderRoom(); }
        renderRoomList();
      });
      item.appendChild(del);
      item.addEventListener("click", function () {
        currentRoomId = room.id; LS.setItem("vc_current_room", room.id);
        $("roomsOverlay").classList.remove("show");
        stopSpeaking(); stopListening(); renderRoom();
      });
      list.appendChild(item);
    });
  }

  function renderMemoList() {
    var list = $("memoList");
    list.innerHTML = "";
    if (!memos.length) {
      var e = document.createElement("div");
      e.className = "note"; e.textContent = "저장된 메모가 없어요. 대화 중 \"메모해줘, ...\"라고 말해보세요.";
      list.appendChild(e);
      return;
    }
    memos.forEach(function (m) {
      var item = document.createElement("div");
      item.className = "roomItem";
      item.style.cursor = "default";
      item.innerHTML = '<div class="rname"><div class="t" style="white-space:normal"></div><div class="s"></div></div>';
      item.querySelector(".t").textContent = m.text;
      item.querySelector(".s").textContent = new Date(m.t).toLocaleString("ko-KR");
      var cp = document.createElement("button");
      cp.className = "del"; cp.style.color = "var(--accent)"; cp.textContent = "📋";
      cp.setAttribute("aria-label", "메모 복사");
      cp.addEventListener("click", function () {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(m.text).catch(function () { fallbackCopy(m.text); });
        else fallbackCopy(m.text);
        cp.textContent = "✅"; setTimeout(function () { cp.textContent = "📋"; }, 1500);
      });
      var del = document.createElement("button");
      del.className = "del"; del.textContent = "🗑";
      del.setAttribute("aria-label", "메모 삭제");
      del.addEventListener("click", function () {
        if (!confirm("이 메모를 삭제할까요?")) return;
        memoDeleted.push(m.id);
        memos = memos.filter(function (x) { return x.id !== m.id; });
        saveMemos(); schedulePush(); renderMemoList();
      });
      item.appendChild(cp); item.appendChild(del);
      list.appendChild(item);
    });
  }

  /* ════════════════ 음성 모드 토글 ════════════════ */
  function setVoiceMode(on) {
    voiceMode = on;
    voiceModeBtn.textContent = on ? "🔴" : "🔊";
    voiceModeBtn.setAttribute("aria-label", on ? "연속 음성 대화 끄기" : "연속 음성 대화 켜기");
    if (on) {
      acquireWakeLock();
      stopSpeaking();
      startListening();
    } else {
      releaseWakeLock();
      stopSpeaking(); stopListening();
      setStatus("");
    }
  }

  /* ════════════════ 설정 ════════════════ */
  function openSettings() {
    $("apiKeyInput").value = settings.apiKey || "";
    $("modelSelect").value = settings.model || "claude-opus-5";
    $("speedSelect").value = settings.effort || "low";
    $("rateSelect").value = (parseFloat(settings.rate) || 1.0).toFixed(1);
    $("bargeSelect").value = settings.barge || "off";
    $("syncUrlInput").value = settings.syncUrl || "";
    $("syncAnonInput").value = settings.syncAnon || "";
    $("syncPassInput").value = settings.syncPass || "";
    $("usageNote").textContent = settings.totalTokens
      ? " 지금까지 사용한 토큰: 약 " + settings.totalTokens.toLocaleString() + "개."
      : "";
    $("settingsOverlay").classList.add("show");
  }

  /* ════════════════ 이벤트 바인딩 ════════════════ */
  micBtn.addEventListener("click", function () {
    if (busy && currentAbort) { currentAbort.abort(); return; }   // 답변 생성 중 → 중지
    if (ttsActive) { stopSpeaking(); if (voiceMode) setTimeout(startListening, 200); else setStatus(""); return; }
    if (recognizing) { cancelPending(); stopListening(); setStatus(""); return; }
    startListening();
  });
  voiceModeBtn.addEventListener("click", function () { setVoiceMode(!voiceMode); });
  $("sendBtn").addEventListener("click", function () {
    if (busy && currentAbort) { currentAbort.abort(); return; }   // ⏹ 답변 중지
    var t = inputEl.value; inputEl.value = ""; sendMessage(t);
  });
  $("newChatBtn").addEventListener("click", function () {
    stopSpeaking(); stopListening();
    newRoom(); renderRoom();
    setStatus("새 대화방을 만들었어요.");
  });
  $("clearChatBtn").addEventListener("click", function () {
    if (!messages.length) { setStatus("비울 대화가 없어요."); return; }
    if (!confirm("현재 대화를 모두 지울까요?")) return;
    stopSpeaking(); stopListening();
    // 동기화 전파를 위해 방을 삭제(tombstone) 처리하고 새 방으로 시작
    deletedRooms.push(currentRoomId); setJSON("vc_deleted", deletedRooms);
    rooms = rooms.filter(function (x) { return x.id !== currentRoomId; });
    LS.removeItem(msgsKey(currentRoomId)); saveRooms();
    newRoom(); renderRoom(); schedulePush();
    setStatus("대화를 비웠어요.");
  });
  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { var t = inputEl.value; inputEl.value = ""; sendMessage(t); }
  });
  $("settingsBtn").addEventListener("click", openSettings);
  $("saveSettingsBtn").addEventListener("click", function () {
    settings.apiKey = $("apiKeyInput").value.trim();
    settings.model = $("modelSelect").value;
    settings.effort = $("speedSelect").value;
    settings.rate = parseFloat($("rateSelect").value) || 1.0;
    settings.barge = $("bargeSelect").value;
    settings.syncUrl = $("syncUrlInput").value.trim();
    settings.syncAnon = $("syncAnonInput").value.trim();
    settings.syncPass = $("syncPassInput").value;
    saveSettings();
    $("settingsOverlay").classList.remove("show");
    if (!settings.apiKey) setStatus("API 키를 입력해야 대화할 수 있어요.", "error");
    else setStatus("설정을 저장했어요.");
    if (syncConfigured()) fullSync(true);
  });
  $("syncNowBtn").addEventListener("click", function () {
    settings.syncUrl = $("syncUrlInput").value.trim();
    settings.syncAnon = $("syncAnonInput").value.trim();
    settings.syncPass = $("syncPassInput").value;
    saveSettings();
    if (!syncConfigured()) {
      $("syncStatus").textContent = "동기화 3칸(URL, anon 키, 암호)을 모두 입력해주세요.";
      return;
    }
    fullSync(true);
  });
  $("clearKeyBtn").addEventListener("click", function () {
    if (!confirm("저장된 API 키를 삭제할까요?")) return;
    settings.apiKey = ""; saveSettings(); $("apiKeyInput").value = "";
  });
  $("roomsBtn").addEventListener("click", function () {
    renderRoomList();
    $("memoCount").textContent = memos.length ? "(" + memos.length + "개)" : "";
    $("roomsOverlay").classList.add("show");
  });
  $("memoOpenBtn").addEventListener("click", function () {
    $("roomsOverlay").classList.remove("show");
    renderMemoList();
    $("memoOverlay").classList.add("show");
  });
  $("memoAddBtn").addEventListener("click", function () {
    var t = prompt("메모할 내용을 입력하세요");
    if (t && t.trim()) { addMemo(t.trim()); renderMemoList(); }
  });
  $("memoExportBtn").addEventListener("click", function () {
    if (!memos.length) { alert("저장된 메모가 없어요."); return; }
    var body = memos.map(function (m) {
      return new Date(m.t).toLocaleString("ko-KR") + "\n" + m.text;
    }).join("\n\n");
    saveAsWord(body, "아이디어 메모 모음");
  });
  $("newRoomBtn").addEventListener("click", function () {
    newRoom(); $("roomsOverlay").classList.remove("show");
    stopSpeaking(); stopListening(); renderRoom();
  });
  [$("settingsOverlay"), $("roomsOverlay"), $("memoOverlay")].forEach(function (ov) {
    ov.addEventListener("click", function (e) { if (e.target === ov) ov.classList.remove("show"); });
  });

  /* ════════════════ 시작 ════════════════ */
  if (!rooms.length) newRoom();
  renderRoom();
  if (syncConfigured()) fullSync(false);   // 앱 열 때 다른 기기의 변경사항 가져오기
  if (!settings.apiKey) {
    setTimeout(function () {
      openSettings();
      setStatus("처음 오셨네요! Claude API 키를 입력하면 시작할 수 있어요.");
    }, 400);
  }
})();
</script>
</body>
</html>
